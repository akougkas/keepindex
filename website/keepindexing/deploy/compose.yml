name: keepindex-site

networks:
  web:
    external: true

services:
  keepindex-site:
    container_name: keepindex-site
    build: .
    image: keepindex-site:local
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    restart: unless-stopped
    ports:
      - 127.0.0.1:8085:80
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.keepindex-site.rule=Host(`keepindex.ing`) || Host(`www.keepindex.ing`)
      - traefik.http.routers.keepindex-site.entrypoints=http
      - traefik.http.services.keepindex-site.loadbalancer.server.port=80
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1/]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
