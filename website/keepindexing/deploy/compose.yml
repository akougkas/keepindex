name: keepindex-site

networks:
  web:
    external: true

services:
  keepindex-site:
    container_name: keepindex-site
    image: nginx:alpine@sha256:db35bfc6b2951e7f8a72db5db120288c127ffaeeb4a6d4b95a26fead017d5913
    restart: unless-stopped
    ports:
      - 127.0.0.1:8085:80
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.keepindex-site.rule=Host(`keepindex.ing`) || Host(`www.keepindex.ing`)
      - traefik.http.routers.keepindex-site.entrypoints=http
      - traefik.http.services.keepindex-site.loadbalancer.server.port=80
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1/]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
