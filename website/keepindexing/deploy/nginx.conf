server {
    listen 80;
    listen [::]:80;
    server_name keepindex.ing www.keepindex.ing localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Clean URLs (Astro static routing)
    location / {
        try_files $uri $uri/ $uri.html /404.html =404;
    }

    # Immutable hashed static assets generated by Astro
    location ~* ^/_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Brand assets, fonts, icons, og-image
    location ~* \.(?:css|js|mjs|svg|png|jpe?g|gif|webp|woff2?|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Robots and sitemap
    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~* sitemap.*\.xml$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Error handling
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
