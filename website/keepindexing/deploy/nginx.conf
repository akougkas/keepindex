server {
    listen 80;
    listen [::]:80;
    server_name www.keepindex.ing;
    return 308 https://keepindex.ing$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name keepindex.ing localhost;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
    location ^~ /_astro/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }
    location ~* \.(?:svg|png|jpe?g|webp|woff2?|ico)$ {
        try_files $uri =404;
        expires 1d;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
